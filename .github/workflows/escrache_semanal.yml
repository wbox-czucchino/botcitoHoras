name: Escrache Semanal Tempo

on:
  schedule:
    # Viernes ~14:00 hora de Chile.
    # Programado 2 horas antes de lo necesario y en un minuto "no redondo" (:07)
    # porque GitHub atrasa los crons programados, sobre todo los que caen en punto.
    # 17:07 UTC = 14:07 Chile en horario de verano (UTC-3, aprox. sept-abril)
    #           = 13:07 Chile en horario estandar (UTC-4).
    - cron: '7 17 * * 5'
  workflow_dispatch:

jobs:
  escrache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar script
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
          TEMPO_TOKEN: ${{ secrets.TEMPO_TOKEN }}
        run: python escrache_semanal.py
